<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEST v3.0</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:20px;min-height:100vh}
h1{color:#ffee66;font-size:40px;margin:20px 0}
.status{font-size:18px;color:#0f0;margin:20px 0;padding:14px;border:2px solid #0f0;border-radius:10px;background:#002200}
button{padding:20px 60px;font-size:22px;font-weight:bold;background:linear-gradient(135deg,#ffee66,#aa44ff);border:none;border-radius:10px;cursor:pointer;color:#000;margin:10px;letter-spacing:3px;box-shadow:0 0 30px rgba(170,68,255,.8)}
button:active{transform:scale(.95)}
.count{font-size:60px;font-weight:900;color:#ffee66;margin:20px 0}
.tip{color:#888;font-size:12px;margin-top:30px;line-height:1.6}
</style>
</head>
<body>
<h1>TEST v3.0</h1>
<div class="status" id="status">✅ الصفحة اتحملت</div>
<div class="count" id="count">0</div>
<button id="testBtn">اضغطني</button>
<div class="tip">
لو شفت الكلمة "اتضغط!" بعد الضغط → الزرار شغال<br>
لو الرقم زاد → الجافاسكريبت شغال<br>
لو مفيش حاجة حصلت → قول لي عشان نصلح
</div>
<script>
var status = document.getElementById('status');
var count = document.getElementById('count');
var n = 0;

status.textContent = '✅ الجافاسكريبت اتشغّل';

document.getElementById('testBtn').addEventListener('click', function(){
  n++;
  count.textContent = n;
  status.textContent = '✅ اتصغط! (المرة ' + n + ')';
  status.style.background = '#003300';
});
</script>
</body>
</html>
