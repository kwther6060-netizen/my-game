<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SOULFIRE — نار الروح</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;font-family:'Segoe UI',Tahoma,sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;touch-action:none}
#c{display:block;position:absolute;inset:0}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}
#top{position:absolute;top:0;left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start}
.score{font-size:10px;letter-spacing:3px;color:#666}
.score b{display:block;font-size:20px;color:#fff;font-weight:900}
#spirit{text-align:center}
#spiritLabel{font-size:10px;letter-spacing:4px;color:#888}
#spiritName{font-size:18px;font-weight:900;letter-spacing:2px;transition:all .3s}
#spiritName.light{color:#ffee66;text-shadow:0 0 15px #ffcc00}
#spiritName.shadow{color:#aa44ff;text-shadow:0 0 15px #8800ff}
#karma{font-size:10px;letter-spacing:2px;color:#666}
#karma b{display:block;font-size:16px;color:#00ff88;font-weight:900}
#hpWrap{position:absolute;top:60px;left:50%;transform:translateX(-50%);width:200px}
#hp{height:10px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.3);border-radius:5px;overflow:hidden}
#hpF{height:100%;background:linear-gradient(90deg,#ff2244,#ff6600);width:100%;transition:width .2s}
#shield{height:6px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,0,.4);border-radius:3px;overflow:hidden;margin-top:3px;display:none}
#shieldF{height:100%;background:linear-gradient(90deg,#ff0,#f80);transition:width .2s}
#joy{position:absolute;bottom:40px;left:30px;width:150px;height:150px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:radial-gradient(circle,rgba(255,255,255,.05),rgba(0,0,0,.5));pointer-events:auto;touch-action:none}
#jk{position:absolute;top:50%;left:50%;width:65px;height:65px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(200,200,255,.6));transform:translate(-50%,-50%);box-shadow:0 0 30px rgba(255,255,255,.5);pointer-events:none;transition:all .1s}
#switchBtn{position:absolute;bottom:60px;right:30px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#ffee66,#cc8800);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:44px;pointer-events:auto;box-shadow:0 0 50px rgba(255,204,0,.8);transition:all .3s;touch-action:none;cursor:pointer}
#switchBtn.shadow{background:radial-gradient(circle,#aa44ff,#4400aa);box-shadow:0 0 50px rgba(136,0,255,.8)}
#switchBtn:active{transform:scale(.9)}
#switchBtn .label{font-size:10px;letter-spacing:2px;font-weight:900;margin-top:2px;color:#000}
#switchBtn.shadow .label{color:#fff}
#switchCd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.7) 0deg,transparent 0deg);pointer-events:none;transition:background .2s}
#enemyCount{position:absolute;top:100px;left:50%;transform:translateX(-50%);font-size:11px;color:#f80;letter-spacing:2px;font-weight:bold}

.screen{position:absolute;inset:0;background:radial-gradient(ellipse at center,#1a0a2a,#000);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:20px;text-align:center;overflow-y:auto}
.screen.on{display:flex}
.screen h1{font-size:52px;font-weight:900;background:linear-gradient(135deg,#ffee66,#aa44ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:10px;margin-bottom:6px;filter:drop-shadow(0 0 30px rgba(170,68,255,.8))}
.screen .subtitle{color:#888;font-size:12px;letter-spacing:8px;margin-bottom:30px}
.screen .story{color:#bbb;font-size:14px;line-height:2.2;max-width:480px;margin-bottom:30px;padding:20px;border:1px solid rgba(170,68,255,.3);background:rgba(20,5,40,.6);border-radius:10px}
.screen .story b{color:#ffee66}
.screen .story i{color:#aa44ff;font-style:normal}
.btn{background:linear-gradient(135deg,#ffee66,#aa44ff);color:#000;border:none;padding:18px 60px;font-size:18px;font-weight:900;letter-spacing:6px;cursor:pointer;border-radius:6px;box-shadow:0 0 50px rgba(170,68,255,.8);pointer-events:auto;font-family:inherit;margin:5px}
.btn:active{transform:scale(.95)}
.btn.red{background:linear-gradient(135deg,#ff2244,#aa0044);color:#fff}
#over h2{font-size:44px;color:#ff2244;text-shadow:0 0 40px #ff2244;letter-spacing:10px;margin-bottom:20px}
#over .stats{display:flex;gap:18px;margin-bottom:25px;flex-wrap:wrap;justify-content:center}
#over .st{background:rgba(20,5,40,.7);padding:12px 22px;border:1px solid rgba(170,68,255,.3);border-radius:8px;min-width:100px}
#over .st .l{color:#666;font-size:10px;letter-spacing:2px;margin-bottom:4px}
#over .st .v{font-size:26px;font-weight:900;color:#ffee66}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="top">
    <div class="score">SCORE<b id="sc">0</b></div>
    <div id="spirit">
      <div id="spiritLabel">SPIRIT</div>
      <div id="spiritName" class="light">☀️ LIGHT</div>
    </div>
    <div id="karma" style="text-align:right">KARMA<b id="kr">0</b></div>
  </div>
  <div id="hpWrap">
    <div id="hp"><div id="hpF"></div></div>
    <div id="shield"><div id="shieldF" style="width:0%"></div></div>
  </div>
  <div id="enemyCount"></div>
  <div id="joy"><div id="jk"></div></div>
  <div id="switchBtn">☀️<div class="label">SWITCH</div><div id="switchCd"></div></div>
</div>

<div class="screen on" id="menu">
  <h1>SOULFIRE</h1>
  <div class="subtitle">نار الروح</div>
  <div class="story">
    حين <b>انطفأت نار الروح</b>، غرق العالم في ظلام أبدي.<br>
    أنت <b>كاي</b> — آخر حارس.<br>
    في جسدك <b>روحان</b>: <b>الضوء</b> و <i>الظل</i>.<br>
    <b>بدّل بينهم</b>، قاتل، و<span style="color:#ffee66">أعد النار</span>.
  </div>
  <button class="btn" id="startBtn">▶ ابدأ الرحلة</button>
</div>

<div class="screen" id="over">
  <h2>GAME OVER</h2>
  <div class="stats">
    <div class="st"><div class="l">WAVE</div><div class="v" id="fWv">1</div></div>
    <div class="st"><div class="l">SCORE</div><div class="v" id="fSc">0</div></div>
    <div class="st"><div class="l">KILLS</div><div class="v" id="fKl">0</div></div>
  </div>
  <button class="btn red" id="retryBtn">⟳ حاول من جديد</button>
</div>

<script>
// ========== SETUP ==========
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W=0, H=0, DPR=1;
function resize(){
  DPR = Math.min(devicePixelRatio, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

// ========== AUDIO ==========
let actx=null;
function initAudio(){
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
}
function tone(freq, dur, type, vol){
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol || 0.1, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t+dur);
}
function sfx(type){
  if (type==='shoot') tone(800, .06, 'square', .03);
  else if (type==='hit') tone(300, .08, 'sawtooth', .05);
  else if (type==='die') tone(400, .25, 'sawtooth', .08);
  else if (type==='hurt') tone(150, .3, 'square', .15);
  else if (type==='switchLight'){ tone(600, .1, 'sine', .15); setTimeout(()=>tone(900, .15, 'sine', .12), 60); }
  else if (type==='switchShadow'){ tone(400, .1, 'sawtooth', .15); setTimeout(()=>tone(200, .2, 'sawtooth', .12), 60); }
  else if (type==='karma') tone(1200, .08, 'sine', .06);
}

// ========== INPUT ==========
const input = { mx:0, my:0 };
const joy = document.getElementById('joy'), jk = document.getElementById('jk');
let joyOn=false, joyX=0, joyY=0;
joy.addEventListener('touchstart', e=>{
  e.preventDefault(); e.stopPropagation();
  joyOn = true;
  const r = joy.getBoundingClientRect();
  joyX = r.left + r.width/2; joyY = r.top + r.height/2;
}, {passive:false});
joy.addEventListener('touchmove', e=>{
  if (!joyOn) return;
  e.preventDefault(); e.stopPropagation();
  const t = e.touches[0];
  let dx = t.clientX - joyX, dy = t.clientY - joyY;
  const d = Math.hypot(dx, dy), mx = 60;
  if (d > mx){ dx = dx/d*mx; dy = dy/d*mx; }
  input.mx = dx/mx; input.my = dy/mx;
  jk.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}, {passive:false});
joy.addEventListener('touchend', e=>{
  e.preventDefault(); joyOn = false;
  input.mx = 0; input.my = 0;
  jk.style.transform = 'translate(-50%, -50%)';
}, {passive:false});

// Keyboard
const keys = {};
addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') { e.preventDefault(); switchSpirit(); }
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

// Switch button
const switchBtn = document.getElementById('switchBtn');
const switchCd = document.getElementById('switchCd');
const switchHandler = e => { e.preventDefault(); e.stopPropagation(); switchSpirit(); };
switchBtn.addEventListener('touchstart', switchHandler, {passive:false});
switchBtn.addEventListener('mousedown', switchHandler);

// ========== GAME STATE ==========
const G = {
  running:false, score:0, wave:0, kills:0,
  shake:0, flash:0, hitStop:0,
  enemiesToSpawn:0, spawnTimer:0, waveActive:false,
  spirit: 'light',  // 'light' or 'shadow'
  switchCd: 0, switchCdMax: 1.5,
  karma: 0
};

// ========== PLAYER (KAI) ==========
const player = {
  x:0, y:0, r:16,
  hp:100, maxHp:100, shield:0, maxShield:0,
  angle:0, shootCd:0,
  speed:300,
  invuln:0,
  // Light spirit stats
  lightDmg: 3, lightRate: 0.15, lightColor: '#ffee66',
  // Shadow spirit stats
  shadowDmg: 8, shadowRate: 0.35, shadowColor: '#aa44ff'
};

function isLight(){ return G.spirit === 'light'; }
function getCurrentDmg(){ return isLight() ? player.lightDmg : player.shadowDmg; }
function getCurrentRate(){ return isLight() ? player.lightRate : player.shadowRate; }
function getCurrentColor(){ return isLight() ? player.lightColor : player.shadowColor; }

function switchSpirit(){
  if (!G.running) return;
  if (G.switchCd > 0) return;
  G.switchCd = G.switchCdMax;
  if (isLight()){
    G.spirit = 'shadow';
    document.getElementById('spiritName').className = 'shadow';
    document.getElementById('spiritName').textContent = '🌑 SHADOW';
    switchBtn.classList.add('shadow');
    switchBtn.innerHTML = '🌑<div class="label">SWITCH</div><div id="switchCd"></div>';
    sfx('switchShadow');
    // Shadow explosion — damage nearby
    addParts(player.x, player.y, '#aa44ff', 30, 400, 5, 0.7);
    for (let i = enemies.length - 1; i >= 0; i--){
      const e = enemies[i];
      if (Math.hypot(e.x-player.x, e.y-player.y) < 200){
        e.hp -= 5; e.hitFlash = 0.15;
        if (e.hp <= 0) killEnemy(i);
      }
    }
    G.shake = 0.5;
  } else {
    G.spirit = 'light';
    document.getElementById('spiritName').className = 'light';
    document.getElementById('spiritName').textContent = '☀️ LIGHT';
    switchBtn.classList.remove('shadow');
    switchBtn.innerHTML = '☀️<div class="label">SWITCH</div><div id="switchCd"></div>';
    sfx('switchLight');
    // Light burst — heal + push
    player.hp = Math.min(player.maxHp, player.hp + 10);
    updateHp();
    addParts(player.x, player.y, '#ffee66', 30, 400, 5, 0.7);
    for (let i = enemies.length - 1; i >= 0; i--){
      const e = enemies[i];
      const dx = e.x - player.x, dy = e.y - player.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d < 250){
        e.x += dx/d * 100;
        e.y += dy/d * 100;
      }
    }
    G.shake = 0.3;
  }
}

// ========== ENEMIES ==========
const enemies = [], bullets = [], parts = [], texts = [];

const ENEMY_TYPES = {
  bone: { color:'#dddddd', r:14, hp:3, speed:80, dmg:10, score:10, glow:'#ffffff' },
  wolf: { color:'#ff6644', r:12, hp:2, speed:180, dmg:8, score:15, glow:'#ff4422' },
  ghost:{ color:'#66ddff', r:16, hp:4, speed:100, dmg:12, score:20, glow:'#44aaff' }
};

function spawnEnemy(type){
  const t = ENEMY_TYPES[type];
  const a = Math.random() * Math.PI * 2;
  const d = Math.max(W, H) * 0.6;
  const hpMult = 1 + G.wave * 0.15;
  enemies.push({
    x: player.x + Math.cos(a)*d,
    y: player.y + Math.sin(a)*d,
    type, hp: t.hp*hpMult, maxHp: t.hp*hpMult,
    r: t.r, speed: t.speed, dmg: t.dmg, score: t.score,
    color: t.color, glow: t.glow,
    hitFlash:0, t: Math.random()*100
  });
}

function addParts(x,y,color,count,speed,size,life){
  if (parts.length > 400) return;
  for (let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2;
    const s = (0.3+Math.random())*speed;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,maxLife:life,r:size*(0.5+Math.random()*0.5),color});
  }
}
function addText(x,y,txt,color,size){
  if (texts.length > 25) texts.shift();
  texts.push({x,y,txt,color,size:size||14,life:0.9,maxLife:0.9,vy:-40});
}

// ========== UPDATE ==========
const clock = { last: performance.now() };

function update(dt){
  if (G.hitStop > 0){ G.hitStop -= dt; dt *= 0.2; }
  if (G.shake > 0) G.shake *= 0.88;
  if (G.flash > 0) G.flash -= dt * 3;
  if (G.switchCd > 0){
    G.switchCd -= dt;
    const pct = Math.max(0, Math.min(1, 1 - G.switchCd / G.switchCdMax));
    const cdEl = switchCd;
    if (cdEl) cdEl.style.background = `conic-gradient(rgba(0,0,0,.7) ${pct*360}deg, transparent ${pct*360}deg)`;
  }
  
  // Movement
  let mx = input.mx, my = input.my;
  if (keys['w']||keys['arrowup']) my = -1;
  if (keys['s']||keys['arrowdown']) my = 1;
  if (keys['a']||keys['arrowleft']) mx = -1;
  if (keys['d']||keys['arrowright']) mx = 1;
  const mag = Math.hypot(mx, my);
  if (mag > 0.1){
    mx /= mag; my /= mag;
    let spd = player.speed;
    if (!isLight()) spd *= 0.8; // Shadow is slower
    else spd *= 1.1; // Light is faster
    player.x += mx * spd * dt;
    player.y += my * spd * dt;
  }
  
  if (player.invuln > 0) player.invuln -= dt;
  
  // Aim at nearest enemy
  let nearest = null, nd = Infinity;
  for (const e of enemies){
    const d = Math.hypot(e.x-player.x, e.y-player.y);
    if (d < nd){ nd = d; nearest = e; }
  }
  if (nearest) player.angle = Math.atan2(nearest.y-player.y, nearest.x-player.x);
  
  // Shoot
  player.shootCd -= dt;
  if (player.shootCd <= 0 && enemies.length > 0){
    player.shootCd = getCurrentRate();
    const color = getCurrentColor();
    const dmg = getCurrentDmg();
    if (isLight()){
      // Light: single fast bullet
      const a = player.angle;
      bullets.push({
        x: player.x + Math.cos(a)*player.r,
        y: player.y + Math.sin(a)*player.r,
        vx: Math.cos(a)*900, vy: Math.sin(a)*900,
        r: 4, dmg, life: 1.5, color
      });
    } else {
      // Shadow: 3-shot spread
      for (let i = -1; i <= 1; i++){
        const a = player.angle + i * 0.18;
        bullets.push({
          x: player.x + Math.cos(a)*player.r,
          y: player.y + Math.sin(a)*player.r,
          vx: Math.cos(a)*700, vy: Math.sin(a)*700,
          r: 6, dmg: dmg/2, life: 1.5, color
        });
      }
    }
    sfx('shoot');
    addParts(player.x+Math.cos(player.angle)*player.r, player.y+Math.sin(player.angle)*player.r, color, 3, 200, 3, 0.15);
  }
  
  // Bullets
  for (let i = bullets.length-1; i >= 0; i--){
    const b = bullets[i];
    const oldX = b.x, oldY = b.y;
    b.x += b.vx*dt; b.y += b.vy*dt;
    b.life -= dt;
    if (b.life <= 0){ bullets.splice(i,1); continue; }
    
    let hit = null;
    for (let s = 1; s <= 4 && !hit; s++){
      const px = oldX + (b.x-oldX)*s/4;
      const py = oldY + (b.y-oldY)*s/4;
      for (let j = enemies.length-1; j >= 0; j--){
        const e = enemies[j];
        if (Math.hypot(e.x-px, e.y-py) < e.r + b.r){
          hit = { e, j, px, py };
          break;
        }
      }
    }
    
    if (hit){
      hit.e.hp -= b.dmg;
      hit.e.hitFlash = 0.1;
      addParts(hit.px, hit.py, hit.e.color, 6, 250, 3, 0.3);
      addText(hit.px, hit.py-10, '-'+Math.round(b.dmg), isLight() ? '#ffee66' : '#aa44ff', 11);
      bullets.splice(i, 1);
      if (hit.e.hp <= 0) killEnemy(hit.j);
    }
  }
  
  // Enemies
  for (let i = enemies.length-1; i >= 0; i--){
    const e = enemies[i];
    if (e.hitFlash > 0) e.hitFlash -= dt;
    e.t += dt;
    const dx = player.x-e.x, dy = player.y-e.y;
    const dd = Math.hypot(dx,dy)||1;
    e.x += dx/dd * e.speed * dt;
    e.y += dy/dd * e.speed * dt;
    
    if (dd < e.r + player.r && player.invuln <= 0){
      player.hp -= e.dmg;
      player.invuln = 0.8;
      G.shake = 0.6; G.flash = 0.4;
      sfx('hurt');
      addParts(player.x, player.y, '#ff2244', 15, 300, 4, 0.5);
      if (player.hp <= 0){ player.hp = 0; gameOver(); return; }
      updateHp();
    }
  }
  
  // Particles
  for (let i = parts.length-1; i >= 0; i--){
    const p = parts[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= dt;
    if (p.life <= 0) parts.splice(i,1);
  }
  // Texts
  for (let i = texts.length-1; i >= 0; i--){
    const t = texts[i];
    t.y += t.vy*dt; t.vy *= 0.94; t.life -= dt;
    if (t.life <= 0) texts.splice(i,1);
  }
  
  // Waves
  if (G.waveActive){
    if (G.enemiesToSpawn > 0){
      G.spawnTimer -= dt;
      if (G.spawnTimer <= 0 && enemies.length < 10){
        const roll = Math.random();
        let type = 'bone';
        if (G.wave >= 2 && roll < 0.4) type = 'wolf';
        if (G.wave >= 3 && roll >= 0.4 && roll < 0.7) type = 'ghost';
        spawnEnemy(type);
        G.enemiesToSpawn--;
        G.spawnTimer = Math.max(0.4, 1.2 - G.wave*0.08);
      }
    } else if (enemies.length === 0){
      G.waveActive = false;
      setTimeout(nextWave, 1500);
    }
  }
  
  document.getElementById('enemyCount').textContent = enemies.length > 0 ? '⚔ ' + enemies.length : '';
  document.getElementById('sc').textContent = G.score;
  document.getElementById('kr').textContent = G.karma;
}

function updateHp(){
  document.getElementById('hpF').style.width = (player.hp/player.maxHp*100)+'%';
}

function killEnemy(idx){
  const e = enemies[idx];
  if (!e) return;
  addParts(e.x, e.y, e.color, 20, 300, 4, 0.7);
  G.shake = Math.max(G.shake, 0.35);
  sfx('die');
  
  G.score += e.score;
  G.kills++;
  G.karma += isLight() ? 1 : -1;
  if (G.karma < 0) G.karma = 0;
  document.getElementById('sc').textContent = G.score;
  document.getElementById('kr').textContent = G.karma;
  
  addText(e.x, e.y, '+'+e.score, e.color, 16);
  sfx('karma');
  
  enemies.splice(idx, 1);
}

function nextWave(){
  if (!G.running) return;
  G.wave++;
  G.enemiesToSpawn = Math.floor(4 + G.wave * 1.5);
  G.spawnTimer = 0;
  G.waveActive = true;
  addText(player.x, player.y - 80, 'WAVE ' + G.wave, '#ffee66', 30);
}

// ========== DRAW ==========
function draw(){
  ctx.fillStyle = '#0a0510';
  ctx.fillRect(0, 0, W, H);
  
  // Ground pattern
  const gridSize = 60;
  ctx.strokeStyle = isLight() ? 'rgba(255,204,0,0.05)' : 'rgba(170,68,255,0.08)';
  ctx.lineWidth = 1;
  const offX = (-player.x) % gridSize, offY = (-player.y) % gridSize;
  for (let x=offX;x<W;x+=gridSize){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=offY;y<H;y+=gridSize){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  
  ctx.save();
  if (G.shake > 0) ctx.translate((Math.random()-0.5)*G.shake*15, (Math.random()-0.5)*G.shake*15);
  ctx.translate(W/2 - player.x, H/2 - player.y);
  
  // Particles
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts){
    const a = p.life/p.maxLife;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = a * 0.85;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*a, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  
  // Bullets
  for (const b of bullets){
    ctx.fillStyle = b.color;
    ctx.shadowBlur = 20; ctx.shadowColor = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r*0.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = 'source-over';
  
  // Enemies
  for (const e of enemies){
    const pulse = 1 + Math.sin(e.t*5)*0.1;
    const r = e.r * pulse;
    ctx.shadowBlur = 20; ctx.shadowColor = e.glow;
    
    if (e.type === 'wolf'){
      ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(Math.atan2(player.y-e.y, player.x-e.x));
      ctx.fillStyle = e.hitFlash > 0 ? '#fff' : e.color;
      ctx.beginPath(); ctx.moveTo(r,0); ctx.lineTo(-r,-r*0.7); ctx.lineTo(-r,r*0.7); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (e.type === 'ghost'){
      ctx.save(); ctx.translate(e.x, e.y);
      ctx.globalAlpha = 0.7 + Math.sin(e.t*3)*0.3;
      ctx.fillStyle = e.hitFlash > 0 ? '#fff' : e.color;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = e.hitFlash > 0 ? '#fff' : e.color;
      ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI*2); ctx.fill();
    }
    
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(e.x-4, e.y-3, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(e.x+4, e.y-3, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    
    if (e.hp < e.maxHp){
      const bw = r * 2.2, bh = 3;
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(e.x-bw/2, e.y-r-9, bw, bh);
      ctx.fillStyle = '#ff2244';
      ctx.fillRect(e.x-bw/2, e.y-r-9, bw*(e.hp/e.maxHp), bh);
    }
  }
  
  // Player — Kai
  const color = getCurrentColor();
  ctx.shadowBlur = 40; ctx.shadowColor = color;
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);
  
  // Aura
  ctx.globalAlpha = 0.3 + Math.sin(performance.now()*0.005)*0.15;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(0, 0, player.r + 12, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  
  // Body — humanoid shape
  ctx.fillStyle = color;
  // Main body
  ctx.beginPath();
  ctx.moveTo(player.r, 0);
  ctx.lineTo(-player.r*0.6, -player.r*0.9);
  ctx.lineTo(-player.r*0.4, 0);
  ctx.lineTo(-player.r*0.6, player.r*0.9);
  ctx.closePath();
  ctx.fill();
  
  // Head
  ctx.fillStyle = isLight() ? '#fff8cc' : '#cc88ff';
  ctx.beginPath(); ctx.arc(-player.r*0.3, 0, player.r*0.55, 0, Math.PI*2); ctx.fill();
  
  // Eye direction
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(player.r*0.1, -2, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(player.r*0.1, 2, 2, 0, Math.PI*2); ctx.fill();
  
  // Weapon — sword
  ctx.strokeStyle = isLight() ? '#ffee66' : '#aa44ff';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(player.r*0.5, 0);
  ctx.lineTo(player.r + 15, 0);
  ctx.stroke();
  
  ctx.restore();
  ctx.shadowBlur = 0;
  
  // Shield ring
  if (player.invuln > 0){
    ctx.strokeStyle = `rgba(255,255,255,${0.3+Math.sin(performance.now()*0.02)*0.3})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 18, 0, Math.PI*2); ctx.stroke();
  }
  
  // Texts
  ctx.textAlign = 'center';
  for (const t of texts){
    ctx.globalAlpha = t.life/t.maxLife;
    ctx.fillStyle = t.color;
    ctx.font = `900 ${t.size}px Tahoma`;
    ctx.shadowBlur = 15; ctx.shadowColor = t.color;
    ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  
  ctx.restore();
  
  // Flash
  if (G.flash > 0){
    ctx.fillStyle = `rgba(255,255,255,${G.flash*0.5})`;
    ctx.fillRect(0, 0, W, H);
  }
  
  // Vignette
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.9);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, isLight() ? 'rgba(20,10,0,0.7)' : 'rgba(10,0,20,0.85)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

// ========== LOOP ==========
function loop(now){
  const dt = Math.min(0.05, (now - clock.last)/1000);
  clock.last = now;
  if (G.running) update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ========== START / END ==========
function startGame(){
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();
  
  G.running = true;
  G.score = 0; G.wave = 0; G.kills = 0; G.karma = 0;
  G.shake = 0; G.flash = 0; G.switchCd = 0;
  G.enemiesToSpawn = 0; G.spawnTimer = 0; G.waveActive = false;
  G.spirit = 'light';
  
  player.x = 0; player.y = 0;
  player.hp = player.maxHp = 100;
  player.shield = player.maxShield = 0;
  player.invuln = 0;
  player.shootCd = 0;
  updateHp();
  
  enemies.length = 0; bullets.length = 0; parts.length = 0; texts.length = 0;
  
  document.getElementById('spiritName').className = 'light';
  document.getElementById('spiritName').textContent = '☀️ LIGHT';
  switchBtn.classList.remove('shadow');
  switchBtn.innerHTML = '☀️<div class="label">SWITCH</div><div id="switchCd"></div>';
  
  document.getElementById('sc').textContent = '0';
  document.getElementById('kr').textContent = '0';
  document.getElementById('menu').classList.remove('on');
  document.getElementById('over').classList.remove('on');
  
  setTimeout(nextWave, 800);
}

function gameOver(){
  G.running = false;
  document.getElementById('fWv').textContent = G.wave;
  document.getElementById('fSc').textContent = G.score;
  document.getElementById('fKl').textContent = G.kills;
  addParts(player.x, player.y, getCurrentColor(), 80, 500, 6, 1.5);
  setTimeout(() => document.getElementById('over').classList.add('on'), 800);
}

document.getElementById('startBtn').onclick = startGame;
document.getElementById('retryBtn').onclick = startGame;

requestAnimationFrame(loop);
</script>
