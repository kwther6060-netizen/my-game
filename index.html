<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SOULFIRE — Cinematic</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;font-family:'Segoe UI',Tahoma,sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;touch-action:none}
#c{display:block;position:absolute;inset:0}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}
#skipBtn{position:absolute;top:16px;left:16px;font-size:12px;color:#666;letter-spacing:2px;padding:8px 14px;border:1px solid #333;border-radius:6px;pointer-events:auto;cursor:pointer;background:rgba(0,0,0,.5);z-index:50}
#skipBtn:active{background:#222}
.hud{position:absolute;top:12px;font-size:9px;letter-spacing:3px;color:#555}
.hud b{display:block;font-size:18px;font-weight:900;color:#fff;letter-spacing:1px}
#hudSc{right:16px;text-align:right}
#hudWv{left:50%;transform:translateX(-50%);text-align:center}
#hudWv b{color:#ff66cc}
#hpOuter{position:absolute;top:60px;left:50%;transform:translateX(-50%);width:200px;height:10px;background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.25);border-radius:5px;overflow:hidden}
#hpFill{height:100%;background:linear-gradient(90deg,#ff2244,#ff6644);width:100%;transition:width .2s}
#joy{position:absolute;bottom:35px;left:25px;width:140px;height:140px;border-radius:50%;border:2px solid rgba(255,238,102,.3);background:radial-gradient(circle,rgba(255,238,102,.06),rgba(0,0,0,.55));pointer-events:auto;touch-action:none;box-shadow:0 0 30px rgba(255,238,102,.15)}
#jk{position:absolute;top:50%;left:50%;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#ffee66);transform:translate(-50%,-50%);box-shadow:0 0 30px #ffee66;pointer-events:none}
#atkBtn{position:absolute;bottom:55px;right:25px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffee88,#cc8800);display:flex;align-items:center;justify-content:center;font-size:44px;pointer-events:auto;box-shadow:0 0 40px rgba(255,204,0,.7),inset 0 -8px 20px rgba(0,0,0,.3);transition:transform .1s;touch-action:none;cursor:pointer;border:3px solid rgba(255,255,255,.4);color:#fff}
#atkBtn:active{transform:scale(.9)}
#spiritBtn{position:absolute;bottom:190px;right:25px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(170,68,255,.9),rgba(100,0,180,.9));display:flex;align-items:center;justify-content:center;font-size:32px;pointer-events:auto;box-shadow:0 0 30px rgba(170,68,255,.8);transition:transform .1s;touch-action:none;cursor:pointer;border:2px solid rgba(255,255,255,.3)}
#spiritBtn:active{transform:scale(.9)}

#menu{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:20px;text-align:center}
#menu h1{font-size:clamp(44px,13vw,72px);font-weight:900;background:linear-gradient(135deg,#ffee66 0%,#ff66cc 50%,#aa44ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:clamp(8px,3.5vw,16px);margin-bottom:6px;filter:drop-shadow(0 0 40px rgba(170,68,255,.9))}
#menu .sub{color:#888;font-size:12px;letter-spacing:10px;margin-bottom:50px}
#menu button{background:linear-gradient(135deg,#ffee66,#aa44ff);color:#000;border:none;padding:18px 60px;font-size:17px;font-weight:900;letter-spacing:6px;cursor:pointer;border-radius:10px;box-shadow:0 0 50px rgba(170,68,255,.8);font-family:inherit;margin:6px;pointer-events:auto}
#menu button:active{transform:scale(.95)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="hud" id="hudSc">SCORE<b id="sc">0</b></div>
  <div class="hud" id="hudWv">WAVE<b id="wv">1</b></div>
  <div id="hpOuter"><div id="hpFill"></div></div>
  <div id="joy"><div id="jk"></div></div>
  <div id="atkBtn">⚔️</div>
  <div id="spiritBtn">🌑</div>
  <div id="skipBtn">تخطي</div>
</div>

<div id="menu">
  <h1>SOULFIRE</h1>
  <div class="sub">نار الروح</div>
  <button id="startBtn">▶ ابدأ</button>
</div>

<script>
// ========== SETUP ==========
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W=0, H=0, DPR=1;
function resize(){
  DPR = Math.min(devicePixelRatio, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

// ========== AUDIO ==========
let actx = null;
function initAudio(){
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
}
function tone(f1, f2, dur, wave, vol, delay){
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = wave || 'sine';
  o.frequency.setValueAtTime(f1, t);
  if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, filterFreq, delay){
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const n = actx.createBufferSource();
  const buf = actx.createBuffer(1, actx.sampleRate * dur, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 1.5);
  n.buffer = buf;
  const f = actx.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = filterFreq || 1000;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  n.connect(f); f.connect(g); g.connect(actx.destination);
  n.start(t);
}
function sfx(t){
  if (t === 'shoot') tone(1400, 500, .06, 'square', .025);
  else if (t === 'hit') tone(400, 100, .05, 'sawtooth', .035);
  else if (t === 'die') noise(.25, .06, 800);
  else if (t === 'hurt') { tone(180, 60, .25, 'square', .1); noise(.15, .05, 500); }
  else if (t === 'spiderCome') { tone(60, 25, 1.5, 'sawtooth', .15); noise(1.5, .08, 200); }
  else if (t === 'spiderYell') { tone(90, 30, .8, 'sawtooth', .2); tone(120, 40, .8, 'square', .1, .1); }
  else if (t === 'web') { tone(300, 800, .15, 'triangle', .05); }
  else if (t === 'switch') { tone(500, 1200, .15, 'sine', .1); tone(800, 1600, .15, 'sine', .08, .08); }
  else if (t === 'levelup') { [0,4,7,12].forEach((s,i) => tone(440*Math.pow(2,s/12), 880*Math.pow(2,s/12), .25, 'sine', .08, i*.08)); }
}

// ========== CINEMATIC ENGINE ==========
// A scene is a sequence of timed "beats" with drawing functions
class Cinematic {
  constructor(){
    this.t = 0;
    this.beats = [];
    this.done = false;
    this.onFinish = null;
  }
  add(time, duration, drawFn){ this.beats.push({ start: time, dur: duration, draw: drawFn }); }
  update(dt){
    this.t += dt;
    // Check if all beats finished
    let maxEnd = 0;
    for (const b of this.beats) maxEnd = Math.max(maxEnd, b.start + b.dur);
    if (this.t >= maxEnd){ this.done = true; if (this.onFinish) this.onFinish(); }
  }
  draw(){
    for (const b of this.beats){
      if (this.t >= b.start && this.t <= b.start + b.dur){
        const progress = (this.t - b.start) / b.dur;
        b.draw(progress, this.t - b.start);
      }
    }
  }
}

// ========== GAME STATE ==========
const G = {
  phase: 'menu', // 'menu', 'intro', 'playing', 'victory'
  wave: 1, score: 0,
  shake: 0, flash: 0, hitStop: 0, slowmo: 0,
  particles: [], texts: [], bullets: [], eBullets: [], webs: [],
  trees: [], // forest trees
  stars: [],
  fogOffset: 0,
  intro: null
};

// ========== FOREST BACKGROUND ==========
function initForest(){
  G.trees = [];
  for (let i = 0; i < 40; i++){
    G.trees.push({
      x: (Math.random() - 0.5) * 3000,
      y: (Math.random() - 0.5) * 3000,
      size: 60 + Math.random() * 120,
      layer: Math.floor(Math.random() * 3), // 0=far, 1=mid, 2=near
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.5 + Math.random() * 0.5
    });
  }
  // Sort by layer
  G.trees.sort((a, b) => a.layer - b.layer);
  
  G.stars = [];
  for (let i = 0; i < 80; i++){
    G.stars.push({
      x: Math.random(),
      y: Math.random() * 0.5,
      twinkle: Math.random() * Math.PI * 2,
      size: 0.5 + Math.random() * 1.5
    });
  }
}
initForest();

// ========== PLAYER (KAI) ==========
const player = {
  x: 0, y: 0, r: 18,
  hp: 100, maxHp: 100,
  angle: -Math.PI/2,
  shootCd: 0, invuln: 0,
  spirit: 'light',
  walkPhase: 0,
  capeWave: 0
};

// ========== BOSS (SPIDER) ==========
const boss = {
  x: 0, y: -250, targetX: 0, targetY: -220,
  r: 70,
  hp: 400, maxHp: 400,
  phase: 1,
  legPhase: 0,
  breathe: 0,
  eyeBlink: 0,
  mouthOpen: 0,
  webCd: 3, minionCd: 5, dashCd: 6,
  state: 'idle', stateT: 0,
  bodyTilt: 0,
  hitFlash: 0,
  active: false,
  dying: false,
  deathT: 0
};

// ========== INPUT ==========
const input = { mx: 0, my: 0 };
const joy = document.getElementById('joy'), jk = document.getElementById('jk');
let joyOn = false, joyX = 0, joyY = 0;
joy.addEventListener('touchstart', e => {
  e.preventDefault(); e.stopPropagation(); joyOn = true;
  const r = joy.getBoundingClientRect();
  joyX = r.left + r.width/2; joyY = r.top + r.height/2;
}, { passive: false });
joy.addEventListener('touchmove', e => {
  if (!joyOn) return;
  e.preventDefault(); e.stopPropagation();
  const t = e.touches[0];
  let dx = t.clientX - joyX, dy = t.clientY - joyY;
  const d = Math.hypot(dx, dy), mx = 60;
  if (d > mx){ dx = dx/d*mx; dy = dy/d*mx; }
  input.mx = dx/mx; input.my = dy/mx;
  jk.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}, { passive: false });
joy.addEventListener('touchend', e => {
  e.preventDefault(); joyOn = false;
  input.mx = 0; input.my = 0;
  jk.style.transform = 'translate(-50%, -50%)';
}, { passive: false });

const atkBtn = document.getElementById('atkBtn');
let atkPressed = false;
atkBtn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); atkPressed = true; }, {passive:false});
atkBtn.addEventListener('touchend', e => { e.preventDefault(); atkPressed = false; }, {passive:false});
atkBtn.addEventListener('mousedown', () => atkPressed = true);
atkBtn.addEventListener('mouseup', () => atkPressed = false);

const spiritBtn = document.getElementById('spiritBtn');
spiritBtn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); switchSpirit(); }, {passive:false});
spiritBtn.addEventListener('click', e => { e.stopPropagation(); switchSpirit(); });

function switchSpirit(){
  if (G.phase !== 'playing') return;
  player.spirit = player.spirit === 'light' ? 'shadow' : 'light';
  spiritBtn.textContent = player.spirit === 'light' ? '🌑' : '☀️';
  sfx('switch');
  const color = player.spirit === 'light' ? '#ffee66' : '#aa44ff';
  addParticles(player.x, player.y, color, 30, 400, 5, 0.7);
  if (player.spirit === 'light'){
    player.hp = Math.min(player.maxHp, player.hp + 20);
    updateHp();
  } else {
    // Burst damage to enemies
    for (let i = G.enemies?.length - 1 || 0; i >= 0; i--){
      const e = G.enemies[i];
      if (e && Math.hypot(e.x - player.x, e.y - player.y) < 200){ e.hp -= 15; e.hitFlash = 0.15; }
    }
  }
}

const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key === ' ') atkPressed = true; });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; if (e.key === ' ') atkPressed = false; });

// ========== SKIP ==========
document.getElementById('skipBtn').addEventListener('click', () => {
  if (G.phase === 'intro') endIntro();
});

// ========== PARTICLES ==========
function addParticles(x, y, color, count, speed, size, life){
  if (G.particles.length > 500) return;
  for (let i = 0; i < count; i++){
    const a = Math.random() * Math.PI * 2;
    const s = (0.3 + Math.random()) * speed;
    G.particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life, maxLife: life, r: size * (0.5 + Math.random() * 0.5),
      color, drag: 0.94
    });
  }
}
function addText(x, y, txt, color, size){
  if (G.texts.length > 40) G.texts.shift();
  G.texts.push({ x, y, txt, color, size: size||16, life: 1.1, maxLife: 1.1, vy: -50 });
}

// ========== ENEMIES (basic for boss fight) ==========
const G_enemies = [];
G.enemies = G_enemies;

function spawnMinion(x, y, type){
  const isWolf = type === 'wolf';
  G_enemies.push({
    x, y,
    r: isWolf ? 14 : 16,
    hp: isWolf ? 5 : 7, maxHp: isWolf ? 5 : 7,
    speed: isWolf ? 180 : 90,
    dmg: isWolf ? 8 : 12,
    color: isWolf ? '#ff6644' : '#dddddd',
    glow: isWolf ? '#ff2200' : '#ffffff',
    shape: isWolf ? 'arrow' : 'skull',
    hitFlash: 0, t: Math.random() * 10,
    walkPhase: Math.random() * 10
  });
  addParticles(x, y, isWolf ? '#ff6644' : '#dddddd', 10, 250, 4, 0.5);
}

// ========== START CINEMATIC ==========
function startIntro(){
  G.phase = 'intro';
  document.getElementById('menu').style.display = 'none';
  initForest();
  
  const intro = new Cinematic();
  intro.onFinish = () => endIntro();
  
  // ===== BEAT 1: Fade from black, moon appears =====
  intro.add(0, 2.5, (p) => {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    // Moon fading in
    const a = Math.min(1, p * 1.2);
    const mx = W * 0.72, my = H * 0.18, mr = Math.min(W, H) * 0.08;
    const g = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 6);
    g.addColorStop(0, `rgba(220,220,255,${a * 0.5})`);
    g.addColorStop(0.3, `rgba(150,150,220,${a * 0.2})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // Moon disc
    ctx.fillStyle = `rgba(230,230,255,${a})`;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
    // Craters
    ctx.fillStyle = `rgba(180,180,200,${a * 0.5})`;
    ctx.beginPath(); ctx.arc(mx - mr*0.3, my - mr*0.2, mr*0.15, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + mr*0.2, my + mr*0.3, mr*0.2, 0, Math.PI*2); ctx.fill();
    
    // Stars appear
    for (const s of G.stars){
      const twinkle = 0.5 + Math.sin(s.twinkle + p * 5) * 0.5;
      ctx.fillStyle = `rgba(255,255,255,${twinkle * a * 0.8})`;
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.size, 0, Math.PI*2); ctx.fill();
    }
  });
  
  // ===== BEAT 2: Trees reveal, fog rolls in =====
  intro.add(2, 3, (p) => {
    // Dark forest silhouette
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    
    // Moon (persistent)
    const mx = W * 0.72, my = H * 0.18, mr = Math.min(W, H) * 0.08;
    const mg = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 6);
    mg.addColorStop(0, 'rgba(220,220,255,0.4)');
    mg.addColorStop(0.3, 'rgba(150,150,220,0.15)');
    mg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = mg;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(230,230,255,0.9)';
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
    
    // Stars
    for (const s of G.stars){
      ctx.fillStyle = `rgba(255,255,255,${0.4 + Math.sin(s.twinkle + p*5)*0.3})`;
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.size, 0, Math.PI*2); ctx.fill();
    }
    
    // Trees fading in
    const reveal = Math.min(1, p * 1.5);
    for (const tree of G.trees){
      const tx = W/2 + tree.x * 0.3;
      const ty = H * 0.7 + tree.y * 0.05;
      if (tx < -100 || tx > W + 100) continue;
      const alpha = [0.15, 0.35, 0.6][tree.layer] * reveal;
      const treeH = tree.size;
      const sway = Math.sin(tree.sway + G.fogOffset * tree.swaySpeed) * 3;
      
      // Trunk
      ctx.fillStyle = `rgba(5,15,5,${alpha})`;
      ctx.beginPath();
      ctx.moveTo(tx - 6, ty + treeH * 0.3);
      ctx.lineTo(tx - 3 + sway * 0.3, ty - treeH);
      ctx.lineTo(tx + 3 + sway * 0.3, ty - treeH);
      ctx.lineTo(tx + 6, ty + treeH * 0.3);
      ctx.closePath(); ctx.fill();
      
      // Branches/crown
      for (let b = 0; b < 5; b++){
        const ba = -Math.PI/2 + (b - 2) * 0.4 + sway * 0.02;
        const bl = treeH * 0.5;
        ctx.strokeStyle = `rgba(5,15,5,${alpha})`;
        ctx.lineWidth = 3 - tree.layer;
        ctx.beginPath();
        ctx.moveTo(tx + sway * 0.3, ty - treeH * 0.8);
        ctx.lineTo(tx + Math.cos(ba) * bl + sway, ty - treeH * 0.8 + Math.sin(ba) * bl);
        ctx.stroke();
      }
    }
    
    // Fog overlay
    const fogG = ctx.createLinearGradient(0, H * 0.6, 0, H);
    fogG.addColorStop(0, `rgba(30,60,30,${p * 0.3})`);
    fogG.addColorStop(1, `rgba(0,0,0,${p * 0.6})`);
    ctx.fillStyle = fogG;
    ctx.fillRect(0, 0, W, H);
  });
  
  // ===== BEAT 3: Spider descends on web thread =====
  intro.add(4.5, 4, (p) => {
    // Forest bg (persistent)
    drawForestBG(p);
    
    // Web thread descending from top
    const spiderProgress = Math.min(1, p * 1.3);
    const spiderY = -200 + (spiderProgress * (H * 0.42 + 200));
    const spiderX = W * 0.5;
    
    // Web thread
    ctx.strokeStyle = `rgba(200,220,200,${0.5 + spiderProgress * 0.3})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(spiderX, 0);
    ctx.lineTo(spiderX + Math.sin(p * 4) * 2, spiderY - boss.r);
    ctx.stroke();
    
    // Draw spider at spiderX, spiderY
    if (spiderProgress > 0.1){
      drawSpiderBig(spiderX, spiderY, 1, p);
    }
    
    // Camera shake as spider gets closer
    if (spiderProgress > 0.7){
      const shakeAmt = (spiderProgress - 0.7) * 3 * 20;
      if (Math.random() < 0.15) sfx('spiderCome');
    }
  });
  
  // ===== BEAT 4: Spider roar + eyes glow =====
  intro.add(8, 3, (p) => {
    // Forest bg
    drawForestBG(1);
    
    const spiderX = W * 0.5;
    const spiderY = H * 0.42;
    
    // Web thread
    ctx.strokeStyle = 'rgba(200,220,200,0.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(spiderX, 0);
    ctx.lineTo(spiderX, spiderY - boss.r);
    ctx.stroke();
    
    // Spider
    drawSpiderBig(spiderX, spiderY, 1, 1, p);
    
    // Screen darkens
    ctx.fillStyle = `rgba(0,0,0,${p * 0.4})`;
    ctx.fillRect(0, 0, W, H);
    
    // Trigger yell sound at start
    if (p < 0.05 && !intro._yelled){ intro._yelled = true; sfx('spiderYell'); }
  });
  
  // ===== BEAT 5: Kai appears at bottom =====
  intro.add(11, 3, (p) => {
    drawForestBG(1);
    
    // Spider (still there, dimmed)
    ctx.globalAlpha = 0.6;
    drawSpiderBig(W * 0.5, H * 0.42, 1, 1, 0.5);
    ctx.globalAlpha = 1;
    
    // Dark overlay
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    
    // Kai silhouette rising from bottom
    const kaiY = H + 100 - p * (H * 0.4 + 100);
    const kaiX = W * 0.5;
    
    // Glow behind Kai
    const glowG = ctx.createRadialGradient(kaiX, kaiY, 0, kaiX, kaiY, 200);
    glowG.addColorStop(0, `rgba(255,238,102,${p * 0.5})`);
    glowG.addColorStop(1, 'rgba(255,238,102,0)');
    ctx.fillStyle = glowG;
    ctx.fillRect(0, 0, W, H);
    
    // Draw Kai bigger
    drawKai(kaiX, kaiY, 2.5, -Math.PI/2, 0);
  });
  
  // ===== BEAT 6: Title card =====
  intro.add(14, 3.5, (p) => {
    // Full black with spider faint behind
    ctx.fillStyle = `rgba(0,0,0,${0.7 + p * 0.3})`;
    ctx.fillRect(0, 0, W, H);
    
    // Title appearing letter by letter
    const title = 'SOULFIRE';
    const totalChars = title.length;
    const shownChars = Math.floor(Math.min(1, p * 1.5) * totalChars);
    
    ctx.font = `900 ${Math.min(W * 0.15, 90)}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    // Gradient fill
    const grad = ctx.createLinearGradient(W * 0.2, H * 0.4, W * 0.8, H * 0.6);
    grad.addColorStop(0, '#ffee66');
    grad.addColorStop(0.5, '#ff66cc');
    grad.addColorStop(1, '#aa44ff');
    
    // Shadow
    ctx.shadowBlur = 40;
    ctx.shadowColor = 'rgba(170,68,255,0.8)';
    ctx.fillStyle = grad;
    
    // Fade in each char
    const displayTitle = title.slice(0, shownChars);
    const fullWidth = ctx.measureText(title).width;
    const startX = W/2 - fullWidth/2;
    const charW = fullWidth / totalChars;
    
    ctx.textAlign = 'left';
    for (let i = 0; i < displayTitle.length; i++){
      ctx.fillText(displayTitle[i], startX + i * charW, H * 0.5);
    }
    ctx.shadowBlur = 0;
    
    // Subtitle
    if (p > 0.6){
      const subA = (p - 0.6) / 0.4;
      ctx.textAlign = 'center';
      ctx.font = `400 18px Arial`;
      ctx.fillStyle = `rgba(200,200,220,${subA})`;
      ctx.fillText('نار الروح', W/2, H * 0.5 + 60);
    }
  });
  
  // Beat 7: Instructions
  intro.add(17.5, 4, (p) => {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    
    const alpha = Math.min(1, p * 1.2);
    
    // Kai standing at bottom-left
    drawKai(W * 0.3, H * 0.7, 2, -Math.PI/3, 0);
    ctx.globalAlpha = alpha;
    
    // Controls
    ctx.font = `900 20px Arial`;
    ctx.fillStyle = '#ffee66';
    ctx.textAlign = 'right';
    ctx.fillText('تحرك', W * 0.65, H * 0.35);
    ctx.font = `400 14px Arial`;
    ctx.fillStyle = '#aaa';
    ctx.fillText('العصا في الزاوية اليسرى', W * 0.65, H * 0.42);
    
    ctx.font = `900 20px Arial`;
    ctx.fillStyle = '#ff6644';
    ctx.fillText('اهجم', W * 0.65, H * 0.55);
    ctx.font = `400 14px Arial`;
    ctx.fillStyle = '#aaa';
    ctx.fillText('زرار ⚔️ في الزاوية اليمنى', W * 0.65, H * 0.62);
    
    ctx.font = `900 20px Arial`;
    ctx.fillStyle = '#aa44ff';
    ctx.fillText('بدّل الروح', W * 0.65, H * 0.75);
    ctx.font = `400 14px Arial`;
    ctx.fillStyle = '#aaa';
    ctx.fillText('زرار ☀️/🌑 فوق زرار الهجوم', W * 0.65, H * 0.82);
  });
  
  G.intro = intro;
  document.getElementById('skipBtn').style.display = 'block';
}

// ========== FOREST BACKGROUND DRAW (reusable) ==========
function drawForestBG(intensity){
  // Sky
  const skyG = ctx.createLinearGradient(0, 0, 0, H);
  skyG.addColorStop(0, '#050510');
  skyG.addColorStop(0.4, '#0a1a0a');
  skyG.addColorStop(1, '#000');
  ctx.fillStyle = skyG;
  ctx.fillRect(0, 0, W, H);
  
  // Moon
  const mx = W * 0.72, my = H * 0.18, mr = Math.min(W, H) * 0.08;
  const mg = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 6);
  mg.addColorStop(0, `rgba(220,220,255,${0.4 * intensity})`);
  mg.addColorStop(0.3, `rgba(150,150,220,${0.15 * intensity})`);
  mg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = mg;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = `rgba(230,230,255,${0.9 * intensity})`;
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
  
  // Stars
  for (const s of G.stars){
    ctx.fillStyle = `rgba(255,255,255,${(0.4 + Math.sin(s.twinkle + performance.now()*0.001) * 0.3) * intensity})`;
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.size, 0, Math.PI*2); ctx.fill();
  }
  
  // Trees
  for (const tree of G.trees){
    const tx = W/2 + tree.x * 0.5;
    const ty = H * 0.75 + tree.y * 0.08;
    if (tx < -100 || tx > W + 100) continue;
    const alpha = [0.15, 0.35, 0.6][tree.layer] * intensity;
    const treeH = tree.size;
    const sway = Math.sin(tree.sway + performance.now() * 0.001 * tree.swaySpeed) * 3;
    
    ctx.fillStyle = `rgba(5,15,5,${alpha})`;
    ctx.beginPath();
    ctx.moveTo(tx - 6, ty + treeH * 0.4);
    ctx.lineTo(tx - 3 + sway * 0.3, ty - treeH);
    ctx.lineTo(tx + 3 + sway * 0.3, ty - treeH);
    ctx.lineTo(tx + 6, ty + treeH * 0.4);
    ctx.closePath(); ctx.fill();
    
    // Branches
    ctx.strokeStyle = `rgba(5,15,5,${alpha})`;
    ctx.lineWidth = 3 - tree.layer;
    for (let b = 0; b < 4; b++){
      const ba = -Math.PI/2 + (b - 1.5) * 0.45 + sway * 0.02;
      const bl = treeH * 0.45;
      ctx.beginPath();
      ctx.moveTo(tx + sway * 0.3, ty - treeH * 0.75);
      ctx.lineTo(tx + Math.cos(ba) * bl + sway, ty - treeH * 0.75 + Math.sin(ba) * bl);
      ctx.stroke();
    }
  }
  
  // Fog
  const fogG = ctx.createLinearGradient(0, H * 0.55, 0, H);
  fogG.addColorStop(0, 'rgba(30,60,30,0.15)');
  fogG.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = fogG;
  ctx.fillRect(0, 0, W, H);
}

// ========== DRAW SPIDER (BIG) ==========
function drawSpiderBig(cx, cy, scale, life, roar){
  const r = boss.r * scale;
  const t = performance.now() * 0.001;
  
  // Breathing
  const breathe = 1 + Math.sin(t * 2) * 0.03;
  
  // Aura / glow
  const auraG = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, r * 2.2);
  auraG.addColorStop(0, `rgba(0,255,68,${0.15 * life})`);
  auraG.addColorStop(1, 'rgba(0,255,68,0)');
  ctx.fillStyle = auraG;
  ctx.fillRect(cx - r*2.5, cy - r*2.5, r*5, r*5);
  
  // === LEGS (8 legs, 2 segments each, animated) ===
  const legPhase = boss.legPhase;
  const legCount = 8;
  for (let i = 0; i < legCount; i++){
    const side = i < 4 ? -1 : 1;
    const idx = i % 4;
    const baseAngle = -Math.PI/2 + (idx - 1.5) * 0.35;
    const legLen1 = r * (1.6 + idx * 0.05);
    const legLen2 = r * (1.4 + idx * 0.05);
    const spread = side * (0.6 + idx * 0.15);
    
    // Animate walking (subtle)
    const walkSway = Math.sin(t * 3 + i * 0.8) * 0.06;
    
    // Joint 1
    const a1 = baseAngle * side + spread + walkSway;
    const j1x = cx + Math.cos(a1 + Math.PI/2) * legLen1 * 0.5;
    const j1y = cy + Math.sin(a1 + Math.PI/2) * legLen1 * 0.5 - r * 0.2;
    
    // Joint 2 (tip)
    const a2 = a1 + 0.7 * side;
    const j2x = j1x + Math.cos(a2 + Math.PI/2) * legLen2 * 0.7;
    const j2y = j1y + Math.sin(a2 + Math.PI/2) * legLen2 * 0.7 + r * 0.5;
    
    // Draw leg with thickness
    ctx.strokeStyle = `rgba(0,30,10,${life})`;
    ctx.lineWidth = r * 0.16 * scale;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a1) * r * 0.5, cy + Math.sin(a1) * r * 0.5);
    ctx.quadraticCurveTo(j1x, j1y, j2x, j2y);
    ctx.stroke();
    
    // Highlight
    ctx.strokeStyle = `rgba(0,255,68,${0.3 * life})`;
    ctx.lineWidth = r * 0.08 * scale;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a1) * r * 0.5, cy + Math.sin(a1) * r * 0.5);
    ctx.quadraticCurveTo(j1x, j1y, j2x, j2y);
    ctx.stroke();
    
    // Joint dots
    ctx.fillStyle = `rgba(0,80,20,${life})`;
    ctx.beginPath(); ctx.arc(j1x, j1y, r * 0.09, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(j2x, j2y, r * 0.07, 0, Math.PI*2); ctx.fill();
  }
  
  // === BODY ===
  // Abdomen (big back part)
  ctx.save();
  ctx.translate(cx, cy - r * 0.15);
  const abG = ctx.createRadialGradient(0, -r*0.2, 0, 0, -r*0.2, r * 1.1);
  abG.addColorStop(0, `rgba(20,60,30,${life})`);
  abG.addColorStop(0.5, `rgba(10,30,15,${life})`);
  abG.addColorStop(1, `rgba(5,15,8,${life})`);
  ctx.fillStyle = abG;
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 1.05 * breathe, r * 0.9 * breathe, 0, 0, Math.PI*2);
  ctx.fill();
  
  // Abdomen markings (V-shape)
  ctx.strokeStyle = `rgba(0,255,68,${0.5 * life})`;
  ctx.lineWidth = r * 0.05;
  ctx.beginPath();
  ctx.moveTo(-r * 0.5, -r * 0.5);
  ctx.lineTo(0, -r * 0.2);
  ctx.lineTo(r * 0.5, -r * 0.5);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-r * 0.5, -r * 0.1);
  ctx.lineTo(0, r * 0.2);
  ctx.lineTo(r * 0.5, -r * 0.1);
  ctx.stroke();
  ctx.restore();
  
  // Cephalothorax (front part / head area)
  ctx.save();
  ctx.translate(cx, cy + r * 0.15);
  const headG = ctx.createRadialGradient(0, -r*0.1, 0, 0, -r*0.1, r * 0.75);
  headG.addColorStop(0, `rgba(30,80,40,${life})`);
  headG.addColorStop(1, `rgba(10,30,15,${life})`);
  ctx.fillStyle = headG;
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 0.75 * breathe, r * 0.6 * breathe, 0, 0, Math.PI*2);
  ctx.fill();
  
  // Eyes (8 red glowing)
  const eyePositions = [
    [-r*0.4, -r*0.15, r*0.08],
    [-r*0.18, -r*0.3, r*0.06],
    [r*0.18, -r*0.3, r*0.06],
    [r*0.4, -r*0.15, r*0.08],
    [-r*0.3, r*0.05, r*0.055],
    [r*0.3, r*0.05, r*0.055],
    [-r*0.14, r*0.18, r*0.045],
    [r*0.14, r*0.18, r*0.045]
  ];
  
  // Blink
  const blink = (Math.sin(t * 0.7) > 0.98) ? 0.1 : 1;
  
  ctx.shadowBlur = 20 * life;
  ctx.shadowColor = '#ff0000';
  for (const [ex, ey, er] of eyePositions){
    ctx.fillStyle = `rgba(255,0,0,${life})`;
    ctx.beginPath();
    ctx.ellipse(ex, ey, er, er * blink, 0, 0, Math.PI*2);
    ctx.fill();
    // Highlight
    ctx.fillStyle = `rgba(255,150,150,${0.9 * life})`;
    ctx.beginPath();
    ctx.arc(ex - er*0.25, ey - er*0.25, er * 0.3, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  
  // Fangs / Chelicerae
  const mouthOpen = roar ? (0.5 + Math.sin(t * 10) * 0.5) : boss.mouthOpen;
  const fangSpread = r * (0.2 + mouthOpen * 0.3);
  
  ctx.fillStyle = `rgba(10,20,10,${life})`;
  ctx.beginPath();
  ctx.ellipse(0, r * 0.4, r * 0.4, r * 0.25, 0, 0, Math.PI*2);
  ctx.fill();
  
  // Fangs
  ctx.fillStyle = `rgba(220,255,220,${life})`;
  ctx.beginPath();
  ctx.moveTo(-fangSpread, r * 0.35);
  ctx.lineTo(-fangSpread * 0.8, r * 0.7);
  ctx.lineTo(-fangSpread * 0.4, r * 0.35);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(fangSpread, r * 0.35);
  ctx.lineTo(fangSpread * 0.8, r * 0.7);
  ctx.lineTo(fangSpread * 0.4, r * 0.35);
  ctx.closePath(); ctx.fill();
  
  // Inner mouth glow
  if (mouthOpen > 0.3){
    const mouthG = ctx.createRadialGradient(0, r*0.45, 0, 0, r*0.45, r*0.35);
    mouthG.addColorStop(0, `rgba(255,100,100,${(mouthOpen - 0.3) * life})`);
    mouthG.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = mouthG;
    ctx.beginPath();
    ctx.ellipse(0, r * 0.45, r * 0.35, r * 0.2, 0, 0, Math.PI*2);
    ctx.fill();
  }
  
  ctx.restore();
  
  // Hit flash
  if (boss.hitFlash > 0){
    ctx.globalAlpha = boss.hitFlash * 3;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx, cy, r * 1.1, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ========== DRAW KAI ==========
function drawKai(cx, cy, scale, angle, walkPhase){
  const r = 16 * scale;
  const isLight = player.spirit === 'light';
  const mainColor = isLight ? '#ffee66' : '#aa44ff';
  const headColor = isLight ? '#fff8cc' : '#cc88ff';
  const glow = isLight ? '#ffcc00' : '#8800ff';
  
  ctx.save();
  ctx.translate(cx, cy);
  
  // Aura
  const auraG = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2);
  auraG.addColorStop(0, `${glow}40`);
  auraG.addColorStop(1, `${glow}00`);
  ctx.fillStyle = auraG;
  ctx.beginPath(); ctx.arc(0, 0, r * 2, 0, Math.PI*2); ctx.fill();
  
  ctx.rotate(angle);
  
  // Cape (behind)
  const capeWave = Math.sin(walkPhase + performance.now() * 0.003) * 0.15;
  ctx.fillStyle = isLight ? '#aa7722' : '#440077';
  ctx.beginPath();
  ctx.moveTo(-r * 0.3, -r * 1.1);
  ctx.quadraticCurveTo(-r * 1.3 + capeWave * 10, 0, -r * 0.3, r * 1.1);
  ctx.lineTo(-r * 0.1, r * 0.8);
  ctx.quadraticCurveTo(-r * 0.9 + capeWave * 10, 0, -r * 0.1, -r * 0.8);
  ctx.closePath();
  ctx.fill();
  
  // Legs (subtle animation)
  const legSwing = Math.sin(walkPhase) * r * 0.4;
  ctx.strokeStyle = isLight ? '#cc8822' : '#220055';
  ctx.lineWidth = r * 0.35;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, r * 0.3);
  ctx.lineTo(-r * 0.2 + legSwing * 0.5, r * 0.9);
  ctx.moveTo(0, r * 0.3);
  ctx.lineTo(r * 0.2 - legSwing * 0.5, r * 0.9);
  ctx.stroke();
  
  // Body (armor)
  const bodyG = ctx.createLinearGradient(0, -r, 0, r);
  bodyG.addColorStop(0, mainColor);
  bodyG.addColorStop(1, isLight ? '#aa8800' : '#440088');
  ctx.fillStyle = bodyG;
  ctx.beginPath();
  ctx.moveTo(r * 0.7, 0);
  ctx.lineTo(-r * 0.4, -r * 0.85);
  ctx.lineTo(-r * 0.6, 0);
  ctx.lineTo(-r * 0.4, r * 0.85);
  ctx.closePath();
  ctx.fill();
  
  // Chest armor detail
  ctx.fillStyle = isLight ? '#ffee88' : '#cc88ff';
  ctx.beginPath();
  ctx.moveTo(r * 0.3, -r * 0.3);
  ctx.lineTo(-r * 0.2, 0);
  ctx.lineTo(r * 0.3, r * 0.3);
  ctx.closePath();
  ctx.fill();
  
  // Head
  ctx.fillStyle = headColor;
  ctx.beginPath();
  ctx.arc(-r * 0.3, 0, r * 0.55, 0, Math.PI*2);
  ctx.fill();
  
  // Helmet
  ctx.fillStyle = mainColor;
  ctx.beginPath();
  ctx.arc(-r * 0.3, 0, r * 0.55, Math.PI, 0);
  ctx.fill();
  
  // Eyes (glow)
  ctx.shadowBlur = 15;
  ctx.shadowColor = glow;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-r * 0.1, -r * 0.15, r * 0.09, 0, Math.PI*2);
  ctx.arc(-r * 0.1, r * 0.15, r * 0.09, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // Sword (glowing)
  ctx.shadowBlur = 25;
  ctx.shadowColor = glow;
  ctx.strokeStyle = mainColor;
  ctx.lineWidth = r * 0.15;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(r * 0.5, 0);
  ctx.lineTo(r * 1.8, 0);
  ctx.stroke();
  
  // Sword tip
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(r * 1.8, 0, r * 0.12, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // Hilt
  ctx.fillStyle = isLight ? '#ffcc00' : '#6600cc';
  ctx.fillRect(r * 0.45, -r * 0.2, r * 0.15, r * 0.4);
  
  ctx.restore();
}

// ========== UPDATE ==========
const clock = { last: performance.now() };

function update(dt){
  const t = performance.now() * 0.001;
  G.fogOffset += dt;
  
  if (G.phase === 'intro'){
    if (G.intro) G.intro.update(dt);
    return;
  }
  
  if (G.phase !== 'playing') return;
  
  if (G.hitStop > 0){ G.hitStop -= dt; dt *= 0.15; }
  if (G.slowmo > 0){ G.slowmo -= dt; dt *= 0.4; }
  if (G.shake > 0) G.shake *= 0.88;
  if (G.flash > 0) G.flash -= dt * 3;
  
  // Movement
  let mx = input.mx, my = input.my;
  if (keys['w'] || keys['arrowup']) my = -1;
  if (keys['s'] || keys['arrowdown']) my = 1;
  if (keys['a'] || keys['arrowleft']) mx = -1;
  if (keys['d'] || keys['arrowright']) mx = 1;
  const mag = Math.hypot(mx, my);
  if (mag > 0.1){
    mx /= mag; my /= mag;
    const speed = player.spirit === 'light' ? 320 : 250;
    player.x += mx * speed * dt;
    player.y += my * speed * dt;
    player.walkPhase += dt * 12;
  } else {
    player.walkPhase += dt * 2;
  }
  if (player.invuln > 0) player.invuln -= dt;
  
  // Aim at boss
  if (boss.active){
    player.angle = Math.atan2(boss.y - player.y, boss.x - player.x);
  }
  
  // Auto-shoot
  player.shootCd -= dt;
  if (player.shootCd <= 0 && boss.active && !boss.dying){
    const isLight = player.spirit === 'light';
    player.shootCd = isLight ? 0.15 : 0.32;
    const color = isLight ? '#ffee66' : '#aa44ff';
    const bulletSpeed = isLight ? 900 : 700;
    const count = isLight ? 1 : 3;
    const spread = isLight ? 0 : 0.2;
    for (let i = 0; i < count; i++){
      const off = (i - (count-1)/2) * spread;
      const a = player.angle + off;
      G.bullets.push({
        x: player.x + Math.cos(a) * (player.r + 5),
        y: player.y + Math.sin(a) * (player.r + 5),
        vx: Math.cos(a) * bulletSpeed,
        vy: Math.sin(a) * bulletSpeed,
        r: isLight ? 5 : 6,
        dmg: isLight ? 4 : 8,
        life: 1.5,
        color, glow: color
      });
    }
    sfx('shoot');
    addParticles(player.x + Math.cos(player.angle) * (player.r + 5), player.y + Math.sin(player.angle) * (player.r + 5), color, 3, 200, 3, 0.15);
  }
  
  // Manual attack
  if (atkPressed && player.shootCd > 0.05){ /* handled by auto-shoot */ }
  
  // Bullets
  for (let i = G.bullets.length - 1; i >= 0; i--){
    const b = G.bullets[i];
    const oldX = b.x, oldY = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0){ G.bullets.splice(i, 1); continue; }
    
    // Boss hit
    if (boss.active && !boss.dying){
      const dd = Math.hypot(boss.x - b.x, boss.y - b.y);
      if (dd < boss.r * 1.1 + b.r){
        boss.hp -= b.dmg;
        boss.hitFlash = 0.12;
        addParticles(b.x, b.y, '#00ff44', 6, 300, 3, 0.3);
        addText(b.x, b.y, '-' + b.dmg, '#fff', 12);
        sfx('hit');
        updateBossHp();
        // Phase transitions
        const pct = boss.hp / boss.maxHp;
        if (pct <= 0.66 && boss.phase === 1){ boss.phase = 2; sfx('spiderYell'); addParticles(boss.x, boss.y, '#ff0000', 30, 400, 6, 0.8); }
        if (pct <= 0.33 && boss.phase === 2){ boss.phase = 3; sfx('spiderYell'); addParticles(boss.x, boss.y, '#ff0000', 40, 500, 7, 0.9); }
        if (boss.hp <= 0){ boss.hp = 0; killBoss(); }
        G.bullets.splice(i, 1);
        continue;
      }
    }
    
    // Minion hit
    for (let j = G_enemies.length - 1; j >= 0; j--){
      const e = G_enemies[j];
      if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + b.r){
        e.hp -= b.dmg;
        e.hitFlash = 0.12;
        addParticles(b.x, b.y, e.glow, 5, 250, 3, 0.25);
        if (e.hp <= 0){
          addParticles(e.x, e.y, e.color, 20, 300, 4, 0.6);
          G_enemies.splice(j, 1);
          G.score += 10;
          document.getElementById('sc').textContent = G.score;
          sfx('die');
        }
        G.bullets.splice(i, 1);
        break;
      }
    }
  }
  
  // Minions
  for (let i = G_enemies.length - 1; i >= 0; i--){
    const e = G_enemies[i];
    if (e.hitFlash > 0) e.hitFlash -= dt;
    e.t += dt;
    e.walkPhase += dt * 10;
    const dx = player.x - e.x, dy = player.y - e.y;
    const dd = Math.hypot(dx, dy) || 1;
    e.x += dx/dd * e.speed * dt;
    e.y += dy/dd * e.speed * dt;
    
    if (dd < e.r + player.r && player.invuln <= 0){
      player.hp -= e.dmg;
      player.invuln = 0.8;
      G.shake = 0.6; G.flash = 0.5;
      addParticles(player.x, player.y, '#ff2244', 12, 250, 4, 0.5);
      sfx('hurt');
      updateHp();
      if (player.hp <= 0){ gameOver(); return; }
    }
  }
  
  // Webs
  for (let i = G.webs.length - 1; i >= 0; i--){
    const w = G.webs[i];
    w.x += w.vx * dt; w.y += w.vy * dt;
    w.life -= dt;
    if (w.life <= 0){ G.webs.splice(i, 1); continue; }
    if (Math.hypot(w.x - player.x, w.y - player.y) < w.r + player.r && player.invuln <= 0){
      player.hp -= 8;
      player.invuln = 0.5;
      G.shake = 0.4;
      addParticles(w.x, w.y, '#88ff88', 12, 200, 3, 0.5);
      sfx('hurt');
      updateHp();
      G.webs.splice(i, 1);
      if (player.hp <= 0){ gameOver(); return; }
    }
  }
  
  // BOSS AI
  if (boss.active && !boss.dying){
    boss.bodyTilt += (Math.sin(t * 1.5) * 0.05 - boss.bodyTilt) * dt * 3;
    boss.breathe += dt;
    boss.legPhase += dt * (1.5 + boss.phase * 0.3);
    boss.eyeBlink = (Math.sin(t * 0.7) > 0.98) ? 1 : 0;
    boss.mouthOpen += (Math.sin(t * 1.5) * 0.15 + 0.1 - boss.mouthOpen) * dt * 3;
    if (boss.hitFlash > 0) boss.hitFlash -= dt;
    
    // Move toward player smoothly
    const dx = player.x - boss.x, dy = player.y - boss.y;
    const dd = Math.hypot(dx, dy) || 1;
    const targetDist = 220;
    
    if (dd > targetDist + 40){
      boss.x += dx/dd * (60 + boss.phase * 20) * dt;
      boss.y += dy/dd * (60 + boss.phase * 20) * dt;
    } else if (dd < targetDist - 40){
      boss.x -= dx/dd * (40 + boss.phase * 15) * dt;
      boss.y -= dy/dd * (40 + boss.phase * 15) * dt;
    }
    
    // Web attacks
    boss.webCd -= dt * (1 + (boss.phase - 1) * 0.3);
    if (boss.webCd <= 0){
      boss.webCd = 3.5 - (boss.phase - 1) * 0.7;
      const a = Math.atan2(player.y - boss.y, player.x - boss.x);
      for (let i = -2; i <= 2; i++){
        const aa = a + i * 0.18;
        G.webs.push({
          x: boss.x, y: boss.y,
          vx: Math.cos(aa) * 260, vy: Math.sin(aa) * 260,
          r: 12, life: 3.5
        });
      }
      sfx('web');
      addParticles(boss.x, boss.y, '#88ff88', 15, 300, 4, 0.5);
    }
    
    // Spawn minions
    boss.minionCd -= dt * (1 + (boss.phase - 1) * 0.4);
    if (boss.minionCd <= 0 && G_enemies.length < 8){
      boss.minionCd = 5 - (boss.phase - 1) * 0.8;
      const count = 1 + boss.phase;
      for (let i = 0; i < count; i++){
        const a = Math.random() * Math.PI * 2;
        spawnMinion(boss.x + Math.cos(a) * boss.r * 1.5, boss.y + Math.sin(a) * boss.r * 1.5, Math.random() < 0.5 ? 'wolf' : 'bone');
      }
    }
    
    // Body collision
    if (dd < boss.r * 0.9 + player.r && player.invuln <= 0){
      player.hp -= 18;
      player.invuln = 1;
      G.shake = 1; G.flash = 0.6;
      sfx('hurt');
      addParticles(player.x, player.y, '#ff2244', 20, 350, 5, 0.6);
      updateHp();
      if (player.hp <= 0){ gameOver(); return; }
    }
  }
  
  // Boss dying animation
  if (boss.dying){
    boss.deathT += dt;
    boss.legPhase += dt * 4;
    if (Math.random() < 0.3){
      addParticles(boss.x + (Math.random()-0.5)*boss.r*2, boss.y + (Math.random()-0.5)*boss.r*2, '#00ff44', 15, 400, 5, 0.8);
    }
    if (boss.deathT > 3 && !boss.victory){
      boss.victory = true;
      showVictory();
    }
  }
  
  // Particles
  for (let i = G.particles.length - 1; i >= 0; i--){
    const p = G.particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= p.drag; p.vy *= p.drag;
    p.life -= dt;
    if (p.life <= 0) G.particles.splice(i, 1);
  }
  
  // Texts
  for (let i = G.texts.length - 1; i >= 0; i--){
    const t = G.texts[i];
    t.y += t.vy * dt;
    t.vy *= 0.95;
    t.life -= dt;
    if (t.life <= 0) G.texts.splice(i, 1);
  }
}

function updateBossHp(){
  // update a boss hp bar? For simplicity skip
}
function updateHp(){
  document.getElementById('hpFill').style.width = Math.max(0, player.hp / player.maxHp * 100) + '%';
}

function killBoss(){
  boss.dying = true;
  boss.deathT = 0;
  boss.victory = false;
  G.shake = 3;
  G.flash = 2;
  G.slowmo = 2;
  sfx('spiderYell');
  for (let i = 0; i < 8; i++){
    setTimeout(() => {
      if (!boss.dying) return;
      const a = Math.random() * Math.PI * 2;
      const r = Math.random() * boss.r * 2;
      addParticles(boss.x + Math.cos(a) * r, boss.y + Math.sin(a) * r, '#00ff44', 30, 500, 6, 1);
    }, i * 150);
  }
  G_enemies.length = 0;
}

function showVictory(){
  G.phase = 'victory';
  // Fade to white then show ending
  let fadeT = 0;
  const fadeInterval = setInterval(() => {
    fadeT += 0.02;
    ctx.fillStyle = `rgba(0,0,0,${fadeT})`;
    ctx.fillRect(0, 0, W, H);
    if (fadeT >= 1){
      clearInterval(fadeInterval);
      setTimeout(() => {
        alert('🏆 انتصرت!\n\nالعنكبوت الأم سقطت.\nالنار عادت تشتعل.\nلكن الرحلة لم تنتهي بعد...');
        location.reload();
      }, 500);
    }
  }, 30);
}

function gameOver(){
  G.phase = 'over';
  setTimeout(() => {
    alert('💀 سقط كاي...\n\nلكن الأسطورة لم تنتهي.\nحاول مرة أخرى.');
    location.reload();
  }, 1000);
}

// ========== DRAW ==========
function draw(){
  const t = performance.now() * 0.001;
  
  if (G.phase === 'menu'){
    // Menu background
    drawForestBG(0.7);
    // Dark overlay
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    return;
  }
  
  if (G.phase === 'intro'){
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    if (G.intro) G.intro.draw();
    return;
  }
  
  if (G.phase === 'playing' || G.phase === 'victory'){
    // === GAME WORLD ===
    // Background
    ctx.fillStyle = '#051005';
    ctx.fillRect(0, 0, W, H);
    
    // Grid
    const gridSize = 80;
    ctx.strokeStyle = 'rgba(0,255,68,0.04)';
    ctx.lineWidth = 1;
    const camX = W/2 - player.x * 0.5;
    const camY = H/2 - player.y * 0.5;
    const offX = camX % gridSize;
    const offY = camY % gridSize;
    for (let x = offX; x < W; x += gridSize){ ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = offY; y < H; y += gridSize){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    
    ctx.save();
    if (G.shake > 0){
      ctx.translate((Math.random()-0.5)*G.shake*15, (Math.random()-0.5)*G.shake*15);
    }
    ctx.translate(camX, camY);
    
    // World coords = player coords now
    const worldOffX = -player.x * 0.5;
    const worldOffY = -player.y * 0.5;
    // So world position (x,y) is drawn at (x + worldOffX + ...)
    // Actually let's simplify: translate to (W/2 - player.x, H/2 - player.y) and draw world coords
    ctx.restore();
    ctx.save();
    if (G.shake > 0){
      ctx.translate((Math.random()-0.5)*G.shake*15, (Math.random()-0.5)*G.shake*15);
    }
    ctx.translate(W/2 - player.x, H/2 - player.y);
    
    // Particles
    ctx.globalCompositeOperation = 'lighter';
    for (const p of G.particles){
      const a = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = a * 0.85;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // Webs
    for (const w of G.webs){
      ctx.strokeStyle = 'rgba(180,255,180,0.7)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i < 6; i++){
        const a = i / 6 * Math.PI * 2 + w.x * 0.01;
        ctx.moveTo(w.x, w.y);
        ctx.lineTo(w.x + Math.cos(a) * w.r * 2, w.y + Math.sin(a) * w.r * 2);
      }
      ctx.stroke();
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI*2); ctx.stroke();
    }
    
    // Bullets
    for (const b of G.bullets){
      ctx.fillStyle = b.color;
      ctx.shadowBlur = 20; ctx.shadowColor = b.glow;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.4, 0, Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
    
    // Minions
    for (const e of G_enemies){
      drawMinion(e);
    }
    
    // Boss
    if (boss.active){
      const deathFade = boss.dying ? Math.max(0, 1 - boss.deathT / 3) : 1;
      drawSpiderBig(boss.x, boss.y, 1, deathFade, false);
    }
    
    // Player
    drawKai(player.x, player.y, 1, player.angle, player.walkPhase);
    
    ctx.restore();
    
    // Damage texts (drawn in screen space)
    ctx.save();
    if (G.shake > 0){
      ctx.translate((Math.random()-0.5)*G.shake*15, (Math.random()-0.5)*G.shake*15);
    }
    ctx.translate(W/2 - player.x, H/2 - player.y);
    ctx.textAlign = 'center';
    for (const t of G.texts){
      const a = Math.max(0, t.life / t.maxLife);
      ctx.globalAlpha = a;
      ctx.fillStyle = t.color;
      ctx.font = `900 ${t.size}px Tahoma`;
      ctx.shadowBlur = 12; ctx.shadowColor = t.color;
      ctx.fillText(t.txt, t.x, t.y);
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.restore();
    
    // Flash
    if (G.flash > 0){
      ctx.fillStyle = `rgba(255,255,255,${Math.min(1, G.flash * 0.4)})`;
      ctx.fillRect(0, 0, W, H);
    }
    
    // Vignette
    const vg = ctx.createRadialGradient(W/2, H/2, H * 0.35, W/2, H/2, H * 0.9);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.85)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawMinion(e){
  ctx.save();
  ctx.translate(e.x, e.y);
  const pulse = 1 + Math.sin(e.t * 5) * 0.1;
  const r = e.r * pulse;
  ctx.shadowBlur = 20; ctx.shadowColor = e.glow;
  ctx.fillStyle = e.hitFlash > 0 ? '#fff' : e.color;
  
  if (e.shape === 'arrow'){
    ctx.rotate(Math.atan2(player.y - e.y, player.x - e.x));
    const legSwing = Math.sin(e.walkPhase) * r * 0.5;
    // Legs
    ctx.strokeStyle = e.color;
    ctx.lineWidth = r * 0.3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-r * 0.3, -r * 0.2);
    ctx.lineTo(-r * 0.5 + legSwing, r * 0.6);
    ctx.moveTo(-r * 0.3, r * 0.2);
    ctx.lineTo(-r * 0.5 - legSwing, r * 0.6);
    ctx.stroke();
    // Body
    ctx.beginPath();
    ctx.moveTo(r, 0); ctx.lineTo(-r, -r * 0.75); ctx.lineTo(-r, r * 0.75);
    ctx.closePath(); ctx.fill();
    // Eye
    ctx.fillStyle = '#ff0000';
    ctx.beginPath(); ctx.arc(r * 0.3, 0, r * 0.2, 0, Math.PI*2); ctx.fill();
  } else {
    // Skull-like
    ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(e.x - r*0.3, e.y - r*0.15, r*0.15, 0, Math.PI*2);
    ctx.arc(e.x + r*0.3, e.y - r*0.15, r*0.15, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.fillRect(e.x - r*0.4, e.y + r*0.3, r*0.8, r*0.1);
  }
  ctx.restore();
}

// ========== LOOP ==========
function loop(now){
  const dt = Math.min(0.05, (now - clock.last) / 1000);
  clock.last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ========== BUTTONS ==========
document.getElementById('startBtn').addEventListener('click', () => {
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();
  startIntro();
});

// ========== INIT ==========
requestAnimationFrame(loop);
</script>
